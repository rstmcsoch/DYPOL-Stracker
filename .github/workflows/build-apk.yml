name: Build Android APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Supabase keys
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add repo secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions), then re-run."
            exit 1
          fi

      - run: npm ci

      - name: Add Capacitor Android and status bar support
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/status-bar@7

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Create Android project with the correct package ID and safe system bars
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.stracker.dypollabs",
            "appName": "Stracker",
            "webDir": "dist",
            "android": {
              "backgroundColor": "#f7f4ec",
              "allowMixedContent": false
            },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "LIGHT",
                "backgroundColor": "#f7f4ec"
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Keep content below the Android status bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          styles = Path("android/app/src/main/res/values/styles.xml")
          source = styles.read_text()
          theme = re.search(r'(<style\s+name="AppTheme\.NoActionBar"[^>]*>)(.*?)(</style>)', source, re.S)
          if not theme:
              raise SystemExit("Could not find AppTheme.NoActionBar; refusing to build without the status-bar inset fix.")
          body = theme.group(2)
          item = '<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>'
          if "windowOptOutEdgeToEdgeEnforcement" not in body:
              body += "\n        " + item + "\n    "
          source = source[:theme.start()] + theme.group(1) + body + theme.group(3) + source[theme.end():]
          styles.write_text(source)
          print("Applied status-bar inset protection to AppTheme.NoActionBar")
          PY
          grep -q 'windowOptOutEdgeToEdgeEnforcement' android/app/src/main/res/values/styles.xml

          # Keep the APK on target SDK 35 so Android 15's documented opt-out remains
          # available. The theme item above prevents the WebView drawing under the
          # status bar on current Android builds that honor this compatibility path.
          sed -i 's/targetSdkVersion 36/targetSdkVersion 35/g' android/variables.gradle android/app/build.gradle 2>/dev/null || true

      - name: Apply Stracker launcher icon
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          R=android/app/src/main/res
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; px=${s##*:}
            convert public/icons/icon-512.png -resize ${px}x${px} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Stracker.apk
          sha256sum Stracker.apk > Stracker.apk.sha256
          ls -lh Stracker.apk
          cat Stracker.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Stracker-Android-APK
          path: |
            Stracker.apk
            Stracker.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "stracker-apk-${{ github.run_number }}" Stracker.apk Stracker.apk.sha256 \
            --title "Stracker Android APK #${{ github.run_number }}" \
            --notes "App name: Stracker. Application ID: com.stracker.dypollabs. Debug-signed APK for direct Android installation."
