# Stracker — build the Android APK from GitHub, with no computer involved.
#
# Install (once, from a phone browser):
#   1. On github.com open mobile/ci/flutter-release.yml and tap the copy icon on the raw file.
#   2. Go to the repository → Add file → Create new file → name it
#      .github/workflows/android-release.yml, paste, commit to the branch you want.
#   3. Settings → Secrets and variables → Actions → add the secrets listed below.
#   4. Actions → "Stracker Android release" → Run workflow.
#   The finished APK appears on the repository's Releases page.
#
# Secrets (all optional except the two Supabase values):
#   SUPABASE_URL, SUPABASE_ANON_KEY      public client configuration
#                                        (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY also work)
#   STRAKER_KEYSTORE_BASE64              base64 of stracker-release.p12 — enables real signing
#   STRAKER_STORE_PASSWORD               keystore password
#   STRAKER_KEY_PASSWORD                 key password (defaults to the store password)
#   STRAKER_KEY_ALIAS                    key alias (defaults to "stracker")
#
# Without the keystore secrets the workflow still produces an installable APK, signed with
# the throwaway debug key, so the app can be tested today. It is labelled "test" and must
# not be distributed.
name: Stracker Android release

on:
  workflow_dispatch:
  push:
    tags: ["stracker-v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Apk
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned on purpose: the Gradle/AGP/Kotlin floors below belong to this exact Flutter
      # release, so a new stable cannot break the build without a commit that says so.
      # Flutter 3.47.7 requires Gradle >= 8.14.0, AGP >= 8.11.1, Kotlin >= 2.2.20, Java 17.
      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Show the toolchain
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Install Dart packages
        working-directory: mobile
        run: flutter pub get

      # Reads the hard floors out of Flutter's own DependencyVersionChecker.kt and compares
      # them with android/gradle/wrapper and android/settings.gradle. Seconds instead of the
      # ~90s a real Gradle failure costs, and the message names the dependency to change.
      - name: Check the Android toolchain versions
        working-directory: mobile
        run: python3 tool/check_toolchain.py

      - name: Analyze (advisory)
        working-directory: mobile
        continue-on-error: true
        run: |
          status=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analyze.log" 2>&1 || status=$?
          grep -E "^ *(error|warning) • " "$RUNNER_TEMP/analyze.log" | head -40 > "$RUNNER_TEMP/analyze-errors.log" || true
          grep -E "^ *info • " "$RUNNER_TEMP/analyze.log" | head -25 >> "$RUNNER_TEMP/analyze-errors.log" || true
          {
            echo "### flutter analyze (advisory)"
            echo '```'
            cat "$RUNNER_TEMP/analyze-errors.log"
            tail -n 1 "$RUNNER_TEMP/analyze.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=ANALYZE::$line"
          done < "$RUNNER_TEMP/analyze-errors.log"
          exit "$status"

      - name: Test (advisory)
        working-directory: mobile
        continue-on-error: true
        run: |
          status=0
          flutter test --reporter expanded > "$RUNNER_TEMP/test.log" 2>&1 || status=$?
          grep -E "\[E\]|Some tests failed|^[0-9]{2}:[0-9]{2} \+" "$RUNNER_TEMP/test.log" | tail -25 > "$RUNNER_TEMP/test-errors.log" || true
          {
            echo "### flutter test (advisory)"
            echo '```'
            cat "$RUNNER_TEMP/test-errors.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=TEST::$line"
          done < "$RUNNER_TEMP/test-errors.log"
          exit "$status"

      - name: Prepare signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.STRAKER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STRAKER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.STRAKER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STRAKER_KEY_ALIAS }}
        run: |
          set -eu
          alias_name="${KEY_ALIAS:-stracker}"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -di > android/stracker-release.p12
            bytes=$(wc -c < android/stracker-release.p12)
            if [ "$bytes" -lt 1000 ]; then
              echo "::error::The keystore secret did not decode (only $bytes bytes). Re-copy the base64 text."
              exit 1
            fi
            {
              echo "STRAKER_KEYSTORE=$GITHUB_WORKSPACE/mobile/android/stracker-release.p12"
              echo "STRAKER_STORE_PASSWORD=$STORE_PASSWORD"
              echo "STRAKER_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
              echo "STRAKER_KEY_ALIAS=$alias_name"
              echo "APK_NAME=Stracker-release.apk"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore ($bytes bytes)." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "STRAKER_ALLOW_DEBUG_SIGNING=true"
              echo "APK_NAME=Stracker-test-debug-signed.apk"
            } >> "$GITHUB_ENV"
            echo "::warning::No keystore secret: this build is debug-signed and for testing only."
            echo "No keystore secret was provided, so this APK is **debug-signed (test only)**." >> "$GITHUB_STEP_SUMMARY"
          fi

      # `android:postSplashScreenTheme` (a library attribute, not a framework one) cost a
      # whole Gradle run: ':app:processReleaseResources' failed after the Dart side compiled.
      - name: Check the Android resources
        working-directory: mobile
        run: python3 tool/check_resources.py

      # The project the app talks to is compiled in (mobile/lib/core/config.dart), so a
      # repository secret can no longer point the APK at somebody else's project - the
      # mistake that made a correct password look wrong. This step proves the committed
      # value is the project the accounts actually live in.
      # Override the expectation with a repository variable EXPECTED_SUPABASE_PROJECT.
      - name: Check which Supabase project the APK will talk to
        working-directory: mobile
        env:
          EXPECTED: ${{ vars.EXPECTED_SUPABASE_PROJECT || 'tkggckwksoatbswrebpu' }}
        run: |
          set -eu
          url=$(sed -n "s/.*_projectUrl = '\(https:\/\/[^']*\)'.*/\1/p" lib/core/config.dart | head -1)
          if [ -z "$url" ]; then
            echo "::error title=No project address::lib/core/config.dart has no default Supabase URL, so the APK could not sign anyone in."
            exit 1
          fi
          host=$(printf '%s' "$url" | sed -E 's#^https?://##; s#/.*$##')
          ref=$(printf '%s' "$host" | cut -d. -f1)
          key=$(grep -c "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" lib/core/config.dart)
          {
            echo "### Supabase project (compiled in)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK will use | \`$ref\` (\`$host\`) |"
            echo "| Expected | \`$EXPECTED\` |"
            echo "| Match | $([ "$ref" = "$EXPECTED" ] && echo 'yes' || echo '**NO**') |"
            echo "| Public key present | $([ "${key:-0}" -gt 0 ] && echo 'yes' || echo '**NO**') |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ref" != "$EXPECTED" ]; then
            echo "::error title=Wrong Supabase project::config.dart points at '$ref' but the accounts live in '$EXPECTED'. Fix lib/core/config.dart before shipping."
            exit 1
          fi
          echo "APK will talk to $ref"

      - name: Build the universal APK
        working-directory: mobile
        run: |
          set -eu
          # No --dart-define here on purpose: the address and public key are committed in
          # lib/core/config.dart, and a stale repository secret must not override them.
          status=0
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            > "$RUNNER_TEMP/build.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE "^e: |error:|Error:|FAILURE:|What went wrong|Execution failed|Could not|Caused by|minimum supported version" \
              "$RUNNER_TEMP/build.log" | head -25 > "$RUNNER_TEMP/build-errors.log" || true
            tail -n 12 "$RUNNER_TEMP/build.log" >> "$RUNNER_TEMP/build-errors.log" || true
            {
              echo "### flutter build apk (failed)"
              echo '```'
              cat "$RUNNER_TEMP/build-errors.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=BUILD::$line"
            done < "$RUNNER_TEMP/build-errors.log"
            exit "$status"
          fi
          tail -n 5 "$RUNNER_TEMP/build.log"

      - name: Check the artifact
        working-directory: mobile
        run: |
          set -eu
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "### APK details"
            echo '```'
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion"
            unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86_64)/libflutter.so' || true
            "$BT/apksigner" verify --print-certs "$APK" | head -6 || true
            echo '```'
            echo "SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          cp "$APK" "out/$APK_NAME"
          sha256sum "out/$APK_NAME" | tee "out/$APK_NAME.sha256"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f mobile/android/stracker-release.p12

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stracker-apk
          path: mobile/out/*
          if-no-files-found: error

      # When something fails, the failing step's log is downloadable as a file instead of a
      # wall of text in the browser — handy when the only device is a phone.
      - name: Upload the logs (diagnosis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stracker-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/analyze.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/build-errors.log

      # Only `main` publishes. Older build workflows that still exist on side branches
      # (apk-debug) use the same `stracker-latest` tag, so restricting the publisher to
      # main means a stale branch can never overwrite the release the owner installs from.
      - name: Publish to Releases (easiest download on a phone)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stracker-latest
          name: Stracker — latest Android build
          # Supersedes the older "Stracker Android APK …" releases on the releases page.
          make_latest: true
          body: |
            Built by GitHub Actions from `${{ github.sha }}`.

            Download the `.apk` file below, then open it on the phone to install.
            If an older Stracker build is already installed, uninstall it first: this APK is
            signed with the project's release key, and Android refuses an update signed with
            a different key.

            Read `docs/VERIFICATION.md` before treating a build as a verified release.
          files: mobile/out/*
          fail_on_unmatched_files: false

      - name: Say why nothing was published (not on main)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::notice::This run built the APK from '${GITHUB_REF_NAME}', so it was uploaded as an artifact only. Releases are published from main."
          echo "Built from \`${GITHUB_REF_NAME}\`: artifact only, no release was published." >> "$GITHUB_STEP_SUMMARY"
