# Stracker Android release.
#
# Install with:
#   mkdir -p .github/workflows
#   cp mobile/ci/flutter-release.yml .github/workflows/flutter-release.yml
#   git add .github/workflows/flutter-release.yml && git commit -m "ci: android release"
#
# Repository secrets used:
#   SUPABASE_URL, SUPABASE_ANON_KEY            (public client configuration)
#   STRAKER_KEYSTORE_BASE64                    (base64 of stracker-release.p12)
#   STRAKER_STORE_PASSWORD, STRAKER_KEY_ALIAS, STRAKER_KEY_PASSWORD
#
# This file is not under .github/workflows/ in the repository because the automation token
# for the current branch has no `workflows` permission; GitHub rejects pushes that create
# workflow files with that token.
name: Stracker Android release

on:
  workflow_dispatch:
  push:
    tags: ["stracker-v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analyze, test, build universal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.5
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test --reporter expanded

      - name: Restore keystore
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.STRAKER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::STRAKER_KEYSTORE_BASE64 is not set; a release build cannot be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/stracker-release.p12

      - name: Build signed universal release APK
        working-directory: mobile
        env:
          STRAKER_KEYSTORE: ${{ github.workspace }}/mobile/android/stracker-release.p12
          STRAKER_STORE_PASSWORD: ${{ secrets.STRAKER_STORE_PASSWORD }}
          STRAKER_KEY_ALIAS: ${{ secrets.STRAKER_KEY_ALIAS }}
          STRAKER_KEY_PASSWORD: ${{ secrets.STRAKER_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Verify artifact
        working-directory: mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | head -6
          echo "--- native libraries (expect all four ABIs) ---"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/libflutter.so'
          echo "--- signer ---"
          "$BT/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Stracker-release.apk
          sha256sum dist/Stracker-release.apk | tee dist/Stracker-release.apk.sha256

      - name: Remove keystore from the workspace
        if: always()
        run: rm -f mobile/android/stracker-release.p12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stracker-release-apk
          path: |
            mobile/dist/Stracker-release.apk
            mobile/dist/Stracker-release.apk.sha256
          if-no-files-found: error
