<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <script>
      // Boot-time font restore: applies the saved interface font before first paint so a
      // returning reader never sees the default family flash, and preloads the active
      // family's regular face (the only weight every page needs first). The stacks mirror
      // src/lib/fonts.ts and the cache key is written by src/contexts/AppearanceContext.tsx
      // — keep all three in sync. Default is Caveat (self-hosted), so it also preloads
      // when saved is missing or 'default'.
      (function () {
        try {
          var stacks = {
            default: "'Caveat', 'Segoe Print', 'Bradley Hand', cursive",
            poppins: "'Poppins', 'Trebuchet MS', system-ui, sans-serif",
            sora: "'Sora', 'Trebuchet MS', system-ui, sans-serif",
            'open-sans': "'Open Sans', 'Trebuchet MS', system-ui, sans-serif"
          };
          var regularFace = {
            default: '/assets/fonts/caveat-latin-400-normal.woff2',
            poppins: '/assets/fonts/poppins-latin-400-normal.woff2',
            sora: '/assets/fonts/sora-latin-400-normal.woff2',
            'open-sans': '/assets/fonts/open-sans-latin-400-normal.woff2'
          };
          var saved = localStorage.getItem('stracker-interface-font');
          if (!saved) saved = 'default';
          if (!stacks[saved]) return;
          document.documentElement.style.setProperty('--app-font-family', stacks[saved]);
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.crossOrigin = 'anonymous';
          preload.href = regularFace[saved];
          document.head.appendChild(preload);
        } catch (error) {
          // Blocked storage or an unknown cached value: the app applies the saved font after mount.
        }
      })();
    </script>
    <meta name="application-name" content="Stracker" />
    <meta name="description" content="Stracker by DYPOL LABS is a digital study notebook for JEE preparation: syllabus tracking, a test journal, mistakes and retries, spaced revision, daily planning, focus sessions and analytics." />
    <meta property="og:title" content="Stracker by DYPOL LABS — a serious JEE 2027 study notebook" />
    <meta property="og:description" content="Syllabus, tests, mistakes, revision, daily planning, focus sessions and analytics in one private notebook." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stracker by DYPOL LABS" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Stracker by DYPOL LABS — a serious JEE 2027 study notebook" />
    <meta name="twitter:description" content="Syllabus, tests, mistakes, revision, daily planning, focus sessions and analytics in one private notebook." />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Stracker — JEE 2027 Study Notebook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
